# Yomia status: https://status.yomia.xyz. Upptime checks each service every 5 minutes from GitHub Actions and
# commits the results here, so this repository's history is the uptime record (SLA evidence).
owner: yomia-org
repo: status

sites:
  - name: Website
    url: https://yomia.ke/
  - name: Console (app.yomia.xyz)
    url: https://app.yomia.xyz/up
  - name: Sign-in
    url: https://auth.yomia.xyz/realms/office/.well-known/openid-configuration
  - name: Yomia ERP
    url: https://yomia.erp.yomia.xyz/api/method/ping
    __dangerous__body_down_if_text_missing: pong
  - name: Yomia Workspace
    url: https://warukira.yomia.xyz/status.php
    __dangerous__body_down_if_text_missing: '"maintenance":false'
  - name: Documents (online editing)
    url: https://collabora.yomia.xyz/hosting/discovery

status-website:
  cname: status.yomia.xyz
  logoUrl: https://yomia.ke/assets/yomia-logo.svg
  favicon: https://yomia.ke/assets/favicon.svg
  name: Yomia status
  introTitle: "Yomia service status"
  introMessage: Live status and uptime history of Yomia ERP, Yomia Workspace and sign-in. Each service is checked every five minutes from outside our servers. Questions? Email [contact@yomia.ke](mailto:contact@yomia.ke).
  theme: light
  navbar:
    - title: Status
      href: /
    - title: yomia.ke
      href: https://yomia.ke

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updateTemplate: "0 0 * * 0"
  updates: "0 3 * * *"
